name: hotel-booking-go

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  ORACLE_HOST: ${ORACLE_HOST:-oracle}
  ORACLE_PORT: ${ORACLE_PORT:-1521}
  ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
  ORACLE_USER: ${ORACLE_USER:-hotel_booking}
  ORACLE_PASSWORD: ${ORACLE_PASSWORD:-hotel_booking_local}

x-go-dev: &go-dev
  image: golang:1.25.0-alpine3.22
  working_dir: /src
  volumes:
    - ../..:/src
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-oracle_admin_local}
      APP_USER: ${ORACLE_USER:-hotel_booking}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-hotel_booking_local}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-test-user.sql:/container-entrypoint-initdb.d/001-test-user.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  schema:
    <<: *go-dev
    environment: *app-env
    command: ["go", "run", "./cmd/schema"]
    depends_on:
      oracle:
        condition: service_healthy
    restart: "no"

  api:
    <<: *go-dev
    environment:
      <<: *app-env
      FUNCTION_TARGET: HotelAPI
      PORT: "8080"
    command: ["go", "run", "./cmd/local"]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  test:
    <<: *go-dev
    profiles: ["test"]
    environment:
      <<: *app-env
      APP_ENV: local
      ORACLE_USER: hotel_booking_test
      ORACLE_PASSWORD: hotel_booking_test_local
      ORACLE_INTEGRATION: "1"
    command: ["go", "test", "-count=1", "./..."]
    depends_on:
      oracle:
        condition: service_healthy

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:539.0.0-emulators
    profiles: ["events"]
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--project=local-hotel", "--host-port=0.0.0.0:8085"]

  pubsubsetup:
    <<: *go-dev
    profiles: ["events"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-hotel
      PUBSUB_TOPIC: booking-created
    command: ["go", "run", "./cmd/pubsubsetup"]
    depends_on:
      pubsub:
        condition: service_started
      eventbridge:
        condition: service_started

  worker:
    <<: *go-dev
    profiles: ["events"]
    environment:
      <<: *app-env
      FUNCTION_TARGET: BookingCreated
      PORT: "8080"
    command: ["go", "run", "./cmd/local"]
    depends_on:
      schema:
        condition: service_completed_successfully
    restart: unless-stopped

  eventbridge:
    <<: *go-dev
    profiles: ["events"]
    environment:
      EVENT_TARGET_URL: http://worker:8080/
    command: ["go", "run", "./cmd/eventbridge"]
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  outbox:
    <<: *go-dev
    profiles: ["events"]
    environment:
      <<: *app-env
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-hotel
      PUBSUB_TOPIC: booking-created
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5s}
    command: ["go", "run", "./cmd/outbox"]
    depends_on:
      schema:
        condition: service_completed_successfully
      pubsubsetup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  oracle-data:
  go-mod-cache:
  go-build-cache:
